
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Royal Enfield Roast 😂</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #080808;
    color: white;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
    text-align: center;
    overflow: hidden;
}

.container {
    padding: 25px;
}

h1 {
    font-size: clamp(35px, 8vw, 75px);
    color: #ff2525;
    text-transform: uppercase;
    text-shadow: 0 0 10px red,
                 0 0 30px red,
                 0 0 60px darkred;
    animation: glow 1.5s infinite alternate;
}

p {
    margin-top: 25px;
    color: #aaa;
    font-size: 18px;
    letter-spacing: 3px;
}

button {
    margin-top: 35px;
    padding: 15px 30px;
    background: red;
    color: white;
    border: none;
    border-radius: 30px;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: white;
    color: red;
}

@keyframes glow {
    from { opacity: 0.7; }
    to { opacity: 1; }
}
</style>
</head>

<body>

<div class="container">
    <h1>LUND LE LE MERA</h1>
    <p>ROYAL ENFIELD KE FAN CHAMCHE 😂</p>
    <button onclick="alert('BURA LAGA LUND LELE FIR 😂')">
        CLICK KAR 😂
    </button>
</div>

</body>
</html>
